[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pwdgrpd"
version = "1.0.0"
# dynamic = ["version"]
description = 'RESTful Unix passwd & group server (pwd & grp daemon)'
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E.*"]
keywords = ['unix', 'passwd', 'group', 'nss']
authors = [
  { name = "Leo", email = "i@hardrain980.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "fastapi~=0.141",
  "pydantic-settings~=2.15",
  "uvicorn~=0.52",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "httpx"]

[project.urls]
Documentation = "https://github.com/leo9800/pwdgrpd#readme"
Issues = "https://github.com/leo9800/pwdgrpd/issues"
Source = "https://github.com/leo9800/pwdgrpd"

[project.scripts]
pwdgrpd = "pwdgrpd.main:run"
